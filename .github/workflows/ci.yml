name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install nbformat
      - run: python -c "import nbformat; import glob; [nbformat.read(f, as_version=4) for f in glob.glob(chr(42)+chr(42)+chr(47)+chr(42)+.ipynb, recursive=True)]"
